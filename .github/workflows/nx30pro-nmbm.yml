
name: Build NX30 Pro NMBM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /etc/mysql
          sudo rm -rf /etc/php
          sudo rm -rf /usr/local/lib/android

          sudo -E apt-get -y purge \
            azure-cli \
            ghc* \
            zulu* \
            llvm* \
            firefox \
            google* \
            dotnet* \
            powershell \
            openjdk* \
            mysql* \
            php*

          sudo -E apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gnutls-dev \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            libyaml-dev \
            libz-dev \
            lld \
            llvm \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            python3-pyelftools \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            zstd

      - name: Update Feeds & Setup Golang
        run: |
          ./scripts/feeds update -a

          rm -rf feeds/packages/lang/golang
          git clone --depth=1 \
            -b 23.x \
            https://github.com/sbwml/packages_lang_golang \
            feeds/packages/lang/golang

          ./scripts/feeds install -a

      - name: Clone PassWall
        run: |
          rm -rf package/helloworld

          git clone --depth=1 \
            https://github.com/sbwml/openwrt_helloworld.git \
            package/helloworld

          rm -rf package/helloworld/v2ray-plugin

      - name: Prepare Xray-core 26.9.9
        run: |
          set -e

          echo "===== Preparing Xray-core ====="

          XRAY_VERSION="26.9.9"
          XRAY_TAG="v${XRAY_VERSION}"

          mkdir -p package/custom/xray-core

          cat > package/custom/xray-core/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=xray-core
          PKG_VERSION:=26.9.9
          PKG_RELEASE:=1

          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com/XTLS/Xray-core.git
          PKG_SOURCE_VERSION:=v26.9.9
          PKG_MIRROR_HASH:=skip

          PKG_LICENSE:=MPL-2.0
          PKG_LICENSE_FILES:=LICENSE

          PKG_BUILD_DEPENDS:=golang/host

          GO_PKG:=github.com/xtls/xray-core
          GO_PKG_LDFLAGS_X:= \
            -X github.com/xtls/xray-core/core.build=OpenWrt \
            -X github.com/xtls/xray-core/core.version=$(PKG_VERSION)

          include $(INCLUDE_DIR)/package.mk
          include $(TOPDIR)/feeds/packages/lang/golang/golang-package.mk

          define Package/xray-core
            SECTION:=net
            CATEGORY:=Network
            TITLE:=Xray-core
            URL:=https://github.com/XTLS/Xray-core
            DEPENDS:=+ca-bundle
          endef

          define Package/xray-core/description
           Xray, Penetrates Everything.
          endef

          define Package/xray-core/install
           $(INSTALL_DIR) $$(1)/usr/bin
           $(INSTALL_BIN) $$(GO_PKG_BUILD_BIN_DIR)/xray $$(1)/usr/bin/xray

           $(INSTALL_DIR) $$(1)/etc/xray
           $(INSTALL_DATA) ./files/config.json.example \
             $$(1)/etc/xray/config.json.example

           $(INSTALL_DIR) $$(1)/etc/init.d
           $(INSTALL_BIN) ./files/xray.init \
             $$(1)/etc/init.d/xray
          endef

          $(eval $(call GoBinPackage,xray-core))
          $(eval $(call BuildPackage,xray-core))
          EOF

          mkdir -p package/custom/xray-core/files

          c
```
