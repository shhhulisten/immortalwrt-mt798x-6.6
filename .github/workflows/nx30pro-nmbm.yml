name: Build NX30 Pro NMBM

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
       
      - name: Update Feeds & Setup Golang
        run: |
          ./scripts/feeds update -a
          # 替换为支持最新 Xray-core 编译的高版本 Golang (Go 1.23+)
          rm -rf feeds/packages/lang/golang
          git clone --depth=1 https://github.com/sbwml/packages_lang_golang -b 23.x feeds/packages/lang/golang
          ./scripts/feeds install -a
      - name: Remove broken packages
        run: |
          # 彻底删除在 6.6 内核下无法编译的 warp 驱动源码
          rm -rf package/mtk/drivers/warp
          rm -rf package/mtk/drivers/mtk-warp
          # 移除旧版 v2ray 插件
          rm -rf package/helloworld/v2ray-plugin
      - name: Clone PassWall
        run: |
          git clone --depth=1 https://github.com/sbwml/openwrt_helloworld.git package/helloworld
          # 移除不需要且易冲突的老旧插件
          rm -rf package/helloworld/v2ray-plugin

      - name: Load verified NX30 Pro config
        run: |  
          cp configs/nx30pro-nmbm.config .config
          make defconfig
      - name: Check config
        run: |
          grep -qx 'CONFIG_TARGET_mediatek=y' .config || true
          grep -qx 'CONFIG_TARGET_mediatek_filogic=y' .config || true
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_h3c_magic-nx30-pro-nmbm=y' .config || true
      - name: Clean broken drivers
        run: |
          rm -rf package/mtk/drivers/mt_wifi
          rm -rf package/mtk/drivers/warp
          rm -rf package/helloworld/v2ray-plugin

      - name: Show selected config
        run: |
          echo "==== target/profile ===="
          grep -E '^(CONFIG_TARGET_|CONFIG_TARGET_PROFILE)' .config | sort || true
          echo "==== required GUI packages ===="
          grep -E '^(CONFIG_PACKAGE_luci-app-mtwifi-cfg|CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn|CONFIG_PACKAGE_luci-app-turboacc-mtk|CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn|CONFIG_PACKAGE_kmod-bonding|CONFIG_PACKAGE_kmod-netlink-diag|CONFIG_PACKAGE_kmod-ipt-fullconenat)' .config || true

      - name: Download sources
        run: |
          make download -j"$(nproc)"

      - name: Build firmware
        run: |
          set -o pipefail
          # 1. 尝试 4 线程并发编译
          # 2. 若失败，自动回退到单线程（-j1 V=s）准确定位并把最终错误直接打印在日志末尾
          make -j4 V=s 2>&1 | tee build.log || make -j1 V=s 2>&1 | tee -a build.log


      - name: Show generated images
        if: always()
        run: |
          echo "==== filogic outputs ===="
          find bin/targets/mediatek/filogic -maxdepth 1 -type f | sort || true
          echo "==== NX30 outputs ===="
          find bin/targets/mediatek/filogic -maxdepth 1 -type f | grep -Ei 'nx30|h3c' || true

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx30pro-output
          path: |
            bin/targets/mediatek/filogic/
            .config
            build.log
          if-no-files-found: warn
