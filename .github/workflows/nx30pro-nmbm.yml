name: Build NX30 Pro NMBM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mysql* php*
          sudo -E apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Update Feeds & Setup Golang
        run: |
          ./scripts/feeds update -a
          # 替换为支持最新 Xray-core 编译的高版本 Golang (Go 1.23+)
          rm -rf feeds/packages/lang/golang
          git clone --depth=1 https://github.com/sbwml/packages_lang_golang -b 23.x feeds/packages/lang/golang
          ./scripts/feeds install -a

      - name: Clone PassWall
        run: |
          # 仅拉取 PassWall 并移除冲突插件
          git clone --depth=1 https://github.com/sbwml/openwrt_helloworld.git package/helloworld
          rm -rf package/helloworld/v2ray-plugin

      - name: Load Official MT7981 Defconfig & Apply Custom Packages
        run: |
          # 1. 使用仓库自带的完整 MT7981 官方闭源无线底包
          if [ -f "defconfig/mt7981-ax3000.config" ]; then
            cp -f defconfig/mt7981-ax3000.config .config
          else
            cp -f configs/nx30pro-nmbm.config .config
          fi

          # 2. 追加自定义 PassWall 与常用工具
          cat <<EOF >> .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_h3c_magic-nx30-pro-nmbm=y

          # ===== PassWall 核心 =====
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geoview=y

          # ===== 常用管理工具 =====
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          EOF

          # 3. 展开并补齐所有依赖
          make defconfig

      - name: Download source packages
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        run: |
          set -o pipefail
          make -j$(nproc) || make -j1 V=s

      - name: Show generated images
        if: always()
        run: |
          echo "==== NX30 outputs ===="
          find bin/targets/mediatek/filogic -maxdepth 1 -type f | grep -Ei 'nx30|h3c' || true

      - name: Upload firmware to Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_NX30Pro_Firmware
          path: |
            bin/targets/mediatek/filogic/*sysupgrade.bin
            bin/targets/mediatek/filogic/*.manifest
            .config
          if-no-files-found: error
